<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Esquina del Barrio - Suscríbete</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    font-family: 'Nunito', Arial, sans-serif;
  }

  body::before {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,0,0,0.15) 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    pointer-events: none;
    animation: pulse-bg 3s ease-in-out infinite;
    z-index: 0;
  }
  @keyframes pulse-bg {
    0%,100% { opacity:.6; transform:translate(-50%,-50%) scale(1); }
    50%     { opacity:1;  transform:translate(-50%,-50%) scale(1.15); }
  }

  .btn-wrapper {
    perspective: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    position: relative;
    z-index: 1;
  }

  /* ── ANCHOR ── */
  .yt-link {
    text-decoration: none;
    display: block;
  }

  /* ── BUTTON ── */
  .yt-cta {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transform-style: preserve-3d;
    transform: rotateX(15deg);
    transition: transform .15s ease, filter .15s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .face-top {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 22px 48px;
    min-width: 300px;
    border-radius: 18px;
    background: linear-gradient(135deg,#ff2e2e 0%,#cc0000 50%,#990000 100%);
    box-shadow:
      0 0 0 2px rgba(255,100,100,.4),
      inset 0 1px 0 rgba(255,255,255,.25),
      inset 0 -2px 0 rgba(0,0,0,.3),
      0 8px 32px rgba(255,0,0,.5),
      0 2px 8px rgba(0,0,0,.8);
    transform: translateZ(8px);
    transition: transform .15s ease, box-shadow .15s ease, background .3s ease;
    overflow: hidden;
  }

  .face-top::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.2) 50%, transparent 70%);
    background-size: 200% 100%;
    background-position: 200% 0;
    border-radius: 18px;
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0%,70% { background-position: 200% 0; }
    85%    { background-position:-200% 0; }
    100%   { background-position:-200% 0; }
  }

  .face-bottom {
    position: absolute; inset: 0; z-index: 1;
    border-radius: 18px;
    background: linear-gradient(180deg,#6b0000 0%,#3d0000 100%);
    transform: translateZ(-6px) translateY(14px);
    box-shadow: 0 20px 40px rgba(0,0,0,.8);
  }

  .btn-text {
    position: relative; z-index: 3;
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: 30px; letter-spacing: 3px;
    color: #fff;
    text-shadow: 0 1px 0 rgba(255,255,255,.4), 0 2px 8px rgba(0,0,0,.6);
    pointer-events: none;
    transition: letter-spacing .3s ease;
  }

  .yt-icon {
    position: relative; z-index: 3;
    width: 36px; height: 36px;
    pointer-events: none;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    flex-shrink: 0;
    transition: transform .3s ease;
  }

  .arrow {
    position: relative; z-index: 3;
    font-size: 20px; color: rgba(255,255,255,.9);
    pointer-events: none;
    transition: transform .3s ease;
  }

  .particles-container {
    position: absolute; inset: 0;
    pointer-events: none; z-index: 10;
    overflow: visible;
  }

  /* HOVER */
  .yt-link:not(.done) .yt-cta:hover {
    transform: rotateX(15deg) translateY(-4px);
    filter: brightness(1.12);
  }
  .yt-link:not(.done) .yt-cta:hover .face-top {
    transform: translateZ(13px);
    box-shadow: 0 0 0 2px rgba(255,130,130,.7), inset 0 1px 0 rgba(255,255,255,.35), 0 14px 50px rgba(255,0,0,.7), 0 4px 12px rgba(0,0,0,.8);
  }
  .yt-link:not(.done) .yt-cta:hover .btn-text { letter-spacing: 4px; }
  .yt-link:not(.done) .yt-cta:hover .arrow    { transform: translateX(5px); }
  .yt-link:not(.done) .yt-cta:hover .yt-icon  { transform: scale(1.1) rotate(-5deg); }

  /* PRESS */
  .yt-link:not(.done) .yt-cta:active {
    transform: rotateX(15deg) translateY(5px);
  }
  .yt-link:not(.done) .yt-cta:active .face-top {
    transform: translateZ(2px);
    box-shadow: 0 0 0 1px rgba(255,80,80,.3), inset 0 2px 4px rgba(0,0,0,.5);
  }

  /* DONE */
  .yt-link.done { pointer-events: none; }
  .yt-link.done .yt-cta { transform: rotateX(15deg) translateY(2px); }
  .yt-link.done .face-top {
    background: linear-gradient(135deg,#2d6a2d 0%,#1a4a1a 50%,#0d300d 100%);
    transform: translateZ(4px);
    box-shadow: 0 0 0 2px rgba(100,255,100,.3), 0 6px 24px rgba(0,150,0,.4);
  }
  .yt-link.done .face-bottom { background: linear-gradient(180deg,#0d2d0d,#071507); }
  .yt-link.done .face-top::before { display: none; }
  .yt-link.done .btn-text { color: #90ff90; text-shadow: 0 0 16px rgba(100,255,100,.7); }

  /* PARTICLES */
  .particle {
    position: absolute; border-radius: 50%; pointer-events: none;
    animation: pb .8s ease-out forwards;
  }
  @keyframes pb {
    0%   { opacity:1; transform:translate(0,0) scale(1); }
    100% { opacity:0; transform:translate(var(--tx),var(--ty)) scale(0); }
  }

  /* RIPPLE */
  .ripple {
    position: absolute; border-radius: 50%;
    background: rgba(255,255,255,.3);
    pointer-events: none;
    animation: ra .6s ease-out forwards; z-index: 5;
  }
  @keyframes ra {
    0%   { width:0;     height:0;     opacity:1; transform:translate(-50%,-50%); }
    100% { width:320px; height:320px; opacity:0; transform:translate(-50%,-50%); }
  }

  .hint {
    font-size: 12px; color: rgba(255,255,255,.22);
    letter-spacing: 1.5px; font-weight: 700;
    text-align: center; transition: color .4s;
    font-family: Arial, sans-serif;
    text-transform: uppercase;
    position: relative; z-index: 1;
  }
  .hint.success { color: rgba(100,255,100,.65); }
</style>
</head>
<body>

<div class="btn-wrapper">
  <a class="yt-link"
     href="https://www.youtube.com/@laesquinadelbarriopodcast?sub_confirmation=1"
     target="_blank"
     rel="noopener noreferrer"
     id="ctaLink"
     onclick="handleClick(event)">

    <div class="yt-cta" id="ctaBtn">
      <div class="face-bottom"></div>
      <div class="face-top">
        <div class="particles-container" id="particles"></div>

        <svg class="yt-icon" viewBox="0 0 90 63" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M88.1 9.9C87.1 6.3 84.3 3.5 80.7 2.5 73.6 0.5 45 0.5 45 0.5S16.4 0.5 9.3 2.5C5.7 3.5 2.9 6.3 1.9 9.9 0 17.1 0 31.5 0 31.5S0 45.9 1.9 53.1C2.9 56.7 5.7 59.5 9.3 60.5 16.4 62.5 45 62.5 45 62.5S73.6 62.5 80.7 60.5C84.3 59.5 87.1 56.7 88.1 53.1 90 45.9 90 31.5 90 31.5S90 17.1 88.1 9.9Z" fill="white"/>
          <path d="M36 44.5L59.5 31.5 36 18.5V44.5Z" fill="#cc0000"/>
        </svg>

        <span class="btn-text" id="btnText">¡Suscríbete!</span>
        <span class="arrow" id="btnArrow">▶</span>
      </div>
    </div>
  </a>

  <div class="hint" id="hint">🔔 Toca para suscribirte a La Esquina del Barrio</div>
</div>

<script>
  let done = false;

  function handleClick(e) {
    if (done) { e.preventDefault(); return; }
    done = true;

    const link    = document.getElementById('ctaLink');
    const btnText = document.getElementById('btnText');
    const btnArrow= document.getElementById('btnArrow');
    const hint    = document.getElementById('hint');
    const pcont   = document.getElementById('particles');

    // Ripple
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = (e.offsetX || 150) + 'px';
    ripple.style.top  = (e.offsetY || 35)  + 'px';
    pcont.appendChild(ripple);

    // Particles
    const colors = ['#ff4444','#ff8800','#ffdd00','#ff2222','#fff'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const angle = (i / 18) * Math.PI * 2;
      const dist  = 60 + Math.random() * 80;
      p.style.cssText = `left:50%;top:50%;
        background:${colors[i % colors.length]};
        --tx:${Math.cos(angle)*dist}px;
        --ty:${Math.sin(angle)*dist}px;
        animation-duration:${.5+Math.random()*.4}s;
        width:${4+Math.random()*8}px;
        height:${4+Math.random()*8}px;`;
      pcont.appendChild(p);
    }

    // Estado verde
    setTimeout(() => {
      link.classList.add('done');
      btnText.textContent  = '¡Listo! ✓';
      btnArrow.textContent = '✔';
      hint.textContent = '🎙️ ¡Bienvenido a La Esquina del Barrio!';
      hint.classList.add('success');
    }, 200);
  }
</script>
</body>
</html>
