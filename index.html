<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Esquina del Barrio Podcast</title>

<!-- Redirect inmediato a YouTube con popup de suscripción -->
<meta http-equiv="refresh" content="0;url=https://www.youtube.com/@laesquinadelbarriopodcast?sub_confirmation=1">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    gap: 20px;
  }
  body::before {
    content:'';
    position:fixed;
    width:500px; height:500px;
    background: radial-gradient(circle, rgba(255,0,0,0.15) 0%, transparent 70%);
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:.5; transform:translate(-50%,-50%) scale(1); }
    50%     { opacity:1;  transform:translate(-50%,-50%) scale(1.1); }
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #cc0000;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    position: relative; z-index: 1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p {
    color: rgba(255,255,255,0.35);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    position: relative; z-index: 1;
  }
  a {
    color: rgba(255,80,80,0.7);
    font-size: 12px;
    position: relative; z-index: 1;
  }
</style>
</head>
<body>

<div class="spinner"></div>
<p>Abriendo YouTube...</p>
<a href="https://www.youtube.com/@laesquinadelbarriopodcast?sub_confirmation=1">
  Clic aquí si no redirige automáticamente
</a>

<script>
  // Doble seguridad: JS redirect inmediato
  window.location.replace("https://www.youtube.com/@laesquinadelbarriopodcast?sub_confirmation=1");
</script>
</body>
</html>
